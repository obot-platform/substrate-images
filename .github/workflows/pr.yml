name: PR images
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: pr-images-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  images:
    uses: ./.github/workflows/images.yml
    with:
      publish: false
      tag: pr-${{ github.event.pull_request.number }}
  build:
    needs: images
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Check images result
        env:
          RESULT: ${{ needs.images.result }}
        run: '[[ "$RESULT" == success ]]'
