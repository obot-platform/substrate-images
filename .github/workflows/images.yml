name: Build images
on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        required: true
      tag:
        type: string
        required: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache: false
      - name: Check scripts and runner
        run: |
          bash -n build.sh
          shellcheck build.sh
          python3 -B -m unittest discover -s claude-runner
          python3 -B -m unittest discover -s tests
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Image names
        env:
          OWNER: ${{ github.repository_owner }}
          SUBSTRATE_REPOSITORY: ${{ vars.SUBSTRATE_IMAGE_REPOSITORY }}
          RUNNER_REPOSITORY: ${{ vars.RUNNER_IMAGE_REPOSITORY }}
        run: |
          owner=${OWNER,,}
          echo "KO_DOCKER_REPO=${SUBSTRATE_REPOSITORY:-ghcr.io/$owner/substrate}" >> "$GITHUB_ENV"
          echo "RUNNER_REPOSITORY=${RUNNER_REPOSITORY:-ghcr.io/$owner/obot-claude-runner}" >> "$GITHUB_ENV"
      - uses: ko-build/setup-ko@61b4d1d396f5b2e7d6bb6fefdce3dc38d1a13445 # v0.10
        with:
          version: v0.19.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build all images
        env:
          PUBLISH: ${{ inputs.publish }}
          IMAGE_TAG: ${{ inputs.tag }}
        run: |
          args=()
          if [[ "$PUBLISH" != true ]]; then
            args+=(--no-push)
          fi
          ./build.sh "${args[@]}" "$KO_DOCKER_REPO" "$RUNNER_REPOSITORY:$IMAGE_TAG"
      - name: Runner image digest
        if: inputs.publish
        env:
          IMAGE_TAG: ${{ inputs.tag }}
        run: |
          digest=$(docker buildx imagetools inspect "$RUNNER_REPOSITORY:$IMAGE_TAG" --format '{{.Manifest.Digest}}')
          if [[ ! $digest =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Unexpected runner image digest: $digest" >&2
            exit 1
          fi
          echo "Runner image: $RUNNER_REPOSITORY@$digest"
          {
            echo "### Runner image"
            echo
            echo "Tag: \`$RUNNER_REPOSITORY:$IMAGE_TAG\`"
            echo
            echo "Digest: \`$RUNNER_REPOSITORY@$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"
